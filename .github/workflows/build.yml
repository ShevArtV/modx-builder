name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.1', '8.3']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, pdo_sqlite, openssl, mbstring
          tools: composer

      - run: composer install --no-interaction --no-progress

      - name: setup, create, build
        run: |
          New-Item -ItemType Directory demo-project | Out-Null
          Set-Location demo-project
          php ../package_builder/modxapp setup
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          php ../package_builder/modxapp create demo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          composer install --no-interaction --no-progress --working-dir=core/components/demo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          php ../package_builder/modxapp build demo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Check transport.zip and tool resolution
        run: php .github/check-build.php demo-project
